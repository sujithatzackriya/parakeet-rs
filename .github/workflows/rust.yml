name: Rust

# Manual trigger ONLY. This workflow never runs automatically on push, pull
# request, or tags. Start it yourself from the Actions tab (Run workflow).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install ALSA (cpal dev-dep, used by the streaming_mic example)
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # Compile + test the optional, feature-gated modules and their examples.
  # Without this, sortformer / multitalker / cohere (and the cohere example)
  # are never built and can break while the default build stays green.
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - sortformer
          - multitalker
          - cohere
          - "sortformer,multitalker,cohere"
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install ALSA (cpal dev-dep, used by the streaming_mic example)
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - name: Build (features + examples)
      run: cargo build --all-targets --features "${{ matrix.features }}"
    - name: Test
      run: cargo test --features "${{ matrix.features }}"

  # Formatting and lint. Non-blocking for now: the existing tree is not yet
  # fmt/clippy clean, and reformatting it wholesale is out of scope. Flip
  # continue-on-error off once a dedicated cleanup lands.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Install ALSA (cpal dev-dep, used by the streaming_mic example)
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - name: rustfmt
      continue-on-error: true
      run: cargo fmt --all --check
    - name: clippy
      continue-on-error: true
      run: cargo clippy --all-targets --all-features

  # Best-effort compile check for advertised alternate targets / execution
  # providers, so the surface does not silently rot. Non-blocking: the GPU EP
  # toolchains are not present on the hosted runner; wasm is the real gate.
  cross-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust (+ wasm target)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: cargo check (wasm32 + webgpu)
      continue-on-error: true
      run: cargo check --target wasm32-unknown-unknown --features webgpu

  # Informational test-coverage summary via cargo-llvm-cov over the no-model
  # unit tests. continue-on-error: this is an instrument, not a gate - there is
  # no coverage threshold enforced here. Models are not downloaded on CI, so
  # this measures the model-free unit-test surface only.
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust (+ llvm-tools)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    - name: Install ALSA (cpal dev-dep, used by the streaming_mic example)
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Coverage summary (no-model unit tests)
      continue-on-error: true
      run: cargo llvm-cov --summary-only

  # Minimum Supported Rust Version gate. Pins a recent stable and confirms the
  # crate still compiles on it (ort 2.0-rc / ndarray 0.17 / edition 2021 set the
  # floor). 1.82 is a starting point - bump if a dependency raises its own MSRV.
  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.82 (MSRV)
      uses: dtolnay/rust-toolchain@1.82
    - name: Install ALSA (cpal dev-dep, used by the streaming_mic example)
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - name: cargo check on MSRV
      run: cargo check --verbose

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
